<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lab1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado y Navegación -->
    <header>
        <nav class="nav">
            <ul class="nav-lista">
                <li><a href="#hero">Inicio</a></li>
                <li><a href="#proyecto">Unidades</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
        <!--  boton de tema y saludo -->
        <div class="controles-tema">
            <span id="saludo" class="texto-saludo"></span>
            <button id="boton-tema" class="btn-tema">☀️ Modo claro</button>
        </div>
    </header>
    

    <main>
        <!-- Hero -->
        <section id="hero" class="hero">
            <h1>Bienvenido a mi Proyecto Lab</h1>
            <p>Laboratorio de Desarrollo de Aplicaciones Web.</p>
        </section>

        <!-- Tabla -->
        <section id="proyecto" class="caracteristicas">
            <h2>Resumen de Unidades</h2>
            <table border="1" class="tabla-basica">
                <thead>
                    <tr>
                        <th>Unidad</th>
                        <th>Contenido</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Front-End (HTML, CSS, Flexbox)</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Desarrollo en React</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Back-End con Django y MySQL</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="contacto">
            <h2>Contacto</h2>
            <form id="formulario-contacto" action="">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                
                <div class="campo">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                
                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" required minlength="10" rows="4"></textarea>
                </div>
                
                <button type="submit">Enviar</button>
                <p id="aviso"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>Universidad Autónoma - Campus Talca</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
